server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # OPDS catalog, extensionless (CrossPoint wants exactly /opds).
    # types{} empties the mime map so default_type wins over .xml
    location = /opds {
        types { }
        default_type "application/atom+xml;profile=opds-catalog;kind=acquisition";
        alias /usr/share/nginx/html/opds.xml;
        add_header Cache-Control "public, max-age=120";
    }
    location = /opds.xml {
        types { }
        default_type "application/atom+xml;profile=opds-catalog;kind=acquisition";
        add_header Cache-Control "public, max-age=120";
    }
    location = /latest.epub {
        types { }
        default_type application/epub+zip;
        add_header Cache-Control "public, max-age=120";
    }
    location ~* \.epub$ {
        types { }
        default_type application/epub+zip;
        add_header Cache-Control "public, max-age=300";
    }
    location / {
        try_files $uri $uri/ =404;
    }
    add_header Cache-Control "public, max-age=120";
}
