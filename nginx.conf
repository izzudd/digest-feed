server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # OPDS catalog, extensionless (CrossPoint wants exactly /opds)
    location = /opds {
        default_type "application/atom+xml;profile=opds-catalog;kind=acquisition";
        try_files /opds.xml =404;
    }
    location = /opds.xml {
        default_type "application/atom+xml;profile=opds-catalog;kind=acquisition";
    }
    location ~* \.epub$ {
        default_type application/epub+zip;
        add_header Cache-Control "public, max-age=300";
    }
    location / {
        try_files $uri $uri/ =404;
    }
    add_header Cache-Control "public, max-age=120";
}
